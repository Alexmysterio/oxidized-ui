[project]
name = "oxidized-ui-backend"
version = "0.1.0"
description = "Backend for Oxidized UI"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.119",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "paramiko>=5.1.0",
    "pydantic-settings>=2.16.1",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.1.0",
    "ruamel.yaml>=0.19.1",
    "sqlalchemy>=2.1.6",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
    "aiohttp>=3.14.5",
    "aiodns>=4.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: requires a running Docker Compose stack",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
