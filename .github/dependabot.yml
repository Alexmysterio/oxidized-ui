version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
