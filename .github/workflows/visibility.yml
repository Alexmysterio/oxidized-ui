name: package-visibility

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Inspect package endpoints
        run: |
          set +e
          echo '--- user list'; gh api '/user/packages?package_type=container'
          echo '--- user package'; gh api '/users/Alexmysterio/packages/container/oxidized-ui'
          echo '--- repo package'; gh api '/repos/Alexmysterio/oxidized-ui/packages/container/oxidized-ui'
          echo '--- patch repo package'; gh api --method PATCH '/repos/Alexmysterio/oxidized-ui/packages/container/oxidized-ui' -f visibility=public
