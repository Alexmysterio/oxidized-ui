name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/alexmysterio/oxidized-ui:latest
            ghcr.io/alexmysterio/oxidized-ui:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Oxidized UI
            org.opencontainers.image.description=Self-hosted control plane for Oxidized
            org.opencontainers.image.source=https://github.com/Alexmysterio/oxidized-ui
