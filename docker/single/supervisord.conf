[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[inet_http_server]
port=127.0.0.1:9001

[supervisorctl]
serverurl=http://127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:ui]
command=/opt/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8080 --workers 1 --no-server-header
directory=/app
user=30000
priority=10
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/ui.log
stderr_logfile=/var/log/supervisor/ui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=HOME="/tmp",TMPDIR="/tmp"

[program:oxidized]
command=/usr/local/bin/oxidized-single-run
user=oxidized
priority=20
autorestart=true
startsecs=8
stdout_logfile=/var/log/supervisor/oxidized.log
stderr_logfile=/var/log/supervisor/oxidized.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=HOME="/home/oxidized",TMPDIR="/tmp"

[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
user=root
priority=30
autorestart=true
stdout_logfile=/var/log/supervisor/caddy.log
stderr_logfile=/var/log/supervisor/caddy.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=HOME="/tmp",XDG_DATA_HOME="/data/caddy",XDG_CONFIG_HOME="/data/caddy-config",TMPDIR="/tmp"
