name: oxidized-ui

services:
  oxidized-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: oxidized-ui-all:local
    container_name: oxidized-ui
    extra_hosts:
      - "oxidized-ui:127.0.0.1"
      - "oxidized:127.0.0.1"
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    ports:
      - "${UI_HTTP_PORT:-80}:80"
      - "${UI_HTTPS_PORT:-443}:443"
      - "${UI_HTTPS_PORT:-443}:443/udp"
    environment:
      TZ: ${TZ:-UTC}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-es}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      FERNET_KEY: ${FERNET_KEY:?FERNET_KEY is required}
      OXIDIZED_SOURCE_TOKEN: ${OXIDIZED_SOURCE_TOKEN:?OXIDIZED_SOURCE_TOKEN is required}
      OXIDIZED_API_URL: http://127.0.0.1:8888
      UI_INTERNAL_URL: http://127.0.0.1:8080
      SUPERVISOR_URL: http://127.0.0.1:9001/RPC2
      SUPERVISOR_PROGRAM: oxidized
      SUPERVISOR_LOGFILE: /var/log/supervisor/oxidized.log
      UI_HOSTNAME: ${UI_HOSTNAME:?UI_HOSTNAME is required}
      UI_DOMAIN: ${UI_DOMAIN:-oxidized.local}
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_ORIGINS: https://${UI_HOSTNAME},https://${UI_DOMAIN:-oxidized.local}
      TRUST_PROXY_HEADERS: "true"
      DATA_DIR: /data
      OXIDIZED_CONFIG_DIR: /oxidized-config
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_LANGUAGE: ${BOOTSTRAP_ADMIN_LANGUAGE:-es}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      INBOUND_WEBHOOK_TOKEN: ${INBOUND_WEBHOOK_TOKEN:-}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-viewer}
      OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-true}
      UI_LOG_LEVEL: ${UI_LOG_LEVEL:-INFO}
    volumes:
      - ./data/ui:/data
      - ./data/config:/oxidized-config
      - ./data/oxidized:/var/lib/oxidized
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

